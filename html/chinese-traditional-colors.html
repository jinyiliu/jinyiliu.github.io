<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:0}
body{
  font-family:"Noto Serif SC","Source Han Serif SC",serif;
  background:#f5f3ee;
  min-height:100vh;
  overflow:hidden;
  transition:background .5s;
}
.wrap{display:flex;height:100vh;position:relative}
/* left sidebar */
.sidebar{
  flex:0 0 440px;
  height:100vh;
  overflow-y:auto;
  padding:2rem 1.8rem;
  background:rgba(255,255,255);
  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:5px 0;
  color:#2c2c2c;
}
.sidebar-item{
  flex:0 0 calc(100%/7);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  cursor:pointer;
  padding:8px 4px;
  position:relative;
  gap:4px;
  height:136px;
}
.sidebar-item.selected{outline:1.7px solid #231b2f}
.sidebar-item.selected .name{opacity:1}
.sidebar-item:hover .name{opacity:1}
.sidebar-item .bar{
  width:20px;
  height:20px;
  border-radius:50%;
  flex-shrink:0;
}
.sidebar-item .name{
  writing-mode:vertical-rl;
  font-size:1.15rem;
  letter-spacing:.06em;
  line-height:1.3;
  white-space:nowrap;
  opacity:.85;
  text-orientation:mixed;
  color:#2c2c2c;
  flex:1;
}
.sidebar-item:hover .name{opacity:1}
/* right main area */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  padding:3rem;
}
.main .color-name{
  writing-mode:vertical-lr;
  font-size:6rem;
  font-weight:500;
  letter-spacing:.3em;
  line-height:1.1;
  white-space:nowrap;
  cursor:pointer;
}
.main .hex-display{
  margin-top:2rem;
  font-family:"SF Mono","Fira Code","Consolas",monospace;
  font-size:1.4rem;
  font-weight:500;
  letter-spacing:.06em;
  opacity:.5;
  cursor:pointer;
  transition:opacity .15s;
}
.main .hex-display:hover{opacity:1}
.main .tcc-index{
  position:absolute;
  top:1.5rem;
  right:1.5rem;
  font-family:"SF Mono","Fira Code","Consolas",monospace;
  font-size:1.2rem;
  font-weight:500;
  opacity:.4;
  cursor:pointer;
  letter-spacing:.06em;
}
@media(max-width:900px){
  .sidebar{flex:0 0 380px;padding:1.2rem 1rem}
  .sidebar-item{padding:6px 2px;gap:3px}
  .main{padding:1.5rem}
  .main .color-name{font-size:4rem}
  .main .hex-display{font-size:1.2rem;margin-top:1rem}
}
@media(max-width:600px){
  .sidebar{flex:0 0 320px;padding:.8rem .6rem}
  .sidebar-item{padding:5px 2px;gap:2px}
}
@media(max-width:500px){
  .sidebar{flex:0 0 100%;padding:.8rem .6rem}
  .sidebar-item{padding:4px 2px;gap:1px}
  .main{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <div class="tcc-index" id="tccIndex"></div>
    <div class="color-name" id="colorName"></div>
  <div class="hex-display" id="hexDisplay"></div>
</div>
</div>

const sidebar=document.getElementById("sidebar");
const colorName=document.getElementById("colorName");
const hexDisplay=document.getElementById("hexDisplay");
const tccIndex=document.getElementById("tccIndex");
const entries=Object.entries(TCC);
let activeIdx=0;

function lum(r,g,b){return(0.299*r+0.587*g+0.114*b)/255}

function setTextColor(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return lum(r,g,b)>.5?"#1a1a1a":"#f0ece4";
}

function selectColor(idx){
  activeIdx=idx;
  const[name,hex]=entries[idx];
  const tc=setTextColor(hex);
  document.body.style.background=hex;
  document.body.style.color=tc;
  colorName.textContent=name;
  colorName.style.color=tc;
  colorName.style.opacity='0';
  colorName.style.transform='translateY(10px)';
  colorName.style.transition='none';
  colorName.offsetHeight;
  colorName.style.transition='opacity .6s ease-out,transform .6s ease-out';
  colorName.style.opacity='1';
  colorName.style.transform='translateY(0)';
  hexDisplay.textContent=hex.toUpperCase();
  hexDisplay.style.color=tc;
  tccIndex.textContent='TCC_'+(idx+1);
  tccIndex.style.color=tc;
  document.querySelectorAll('.sidebar-item').forEach((el,i)=>{
    el.classList.toggle('selected',i===idx);
    if(i===idx) el.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
}

entries.forEach(([name,hex],idx)=>{
  const item=document.createElement('div');
  item.className='sidebar-item';
  item.innerHTML=`<div class="bar" style="background:${hex}"></div><div class="name">${name}</div>`;
  item.addEventListener('click',()=>selectColor(idx));
  sidebar.appendChild(item);
});

selectColor(0);

hexDisplay.addEventListener('click',async()=>{
  try{
    await navigator.clipboard.writeText(entries[activeIdx][1]);
    const orig=hexDisplay.textContent;
    hexDisplay.textContent='copied';
    setTimeout(()=>hexDisplay.textContent=orig,800);
  }catch(e){}
});
tccIndex.addEventListener('click',async()=>{
  try{
    await navigator.clipboard.writeText('TCC_'+(activeIdx+1));
    const orig=tccIndex.textContent;
    tccIndex.textContent='copied';
    setTimeout(()=>tccIndex.textContent=orig,800);
  }catch(e){}
});
colorName.addEventListener('click',async()=>{
  try{
    await navigator.clipboard.writeText(entries[activeIdx][1]);
    const orig=hexDisplay.textContent;
    hexDisplay.textContent='copied';
    setTimeout(()=>hexDisplay.textContent=orig,800);
  }catch(e){}
});
</script>
